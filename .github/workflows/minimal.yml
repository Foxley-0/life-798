name: Build Minimal APK

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'minimal/**'
      - '.github/workflows/minimal.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'minimal/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minimal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          # GitHub 的 ubuntu runner 自带 Android SDK，直接用 ANDROID_HOME，
          # 不再依赖 setup-android action（该 action 在部分环境会失败）。
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK 目录: $SDK"
          ls "$SDK" || true

          SM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          echo "sdkmanager: ${SM:-未找到}"

          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platforms;android-37" "build-tools;35.0.0" 2>&1 | tail -5 || true
          fi
          echo "已安装 platforms:"
          ls "$SDK/platforms" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate secrets.properties
        env:
          API_GATEWAY: ${{ secrets.API_GATEWAY }}
          APP_SIGN_SALT: ${{ secrets.APP_SIGN_SALT }}
        run: |
          if [ -z "$API_GATEWAY" ]; then
            echo "::warning::未配置 Secret API_GATEWAY，产出的 APK 无法连接服务端，仅用于验证编译是否通过"
          fi
          if [ -z "$APP_SIGN_SALT" ]; then
            echo "::warning::未配置 Secret APP_SIGN_SALT，登录签名会失败"
          fi
          printf 'API_GATEWAY=%s\n' "$API_GATEWAY" > secrets.properties
          printf 'APP_SIGN_SALT=%s\n' "$APP_SIGN_SALT" >> secrets.properties
          echo "secrets.properties 已生成（内容不打印）"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次使用默认 debug 签名（每次构建签名都不同，无法覆盖安装）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.keystore
          SIZE=$(stat -c%s release.keystore 2>/dev/null || echo 0)
          echo "keystore 还原: $SIZE 字节"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::keystore 只有 $SIZE 字节，不是合法文件，请检查 KEYSTORE_BASE64"
            rm -f release.keystore
            exit 1
          fi

      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/minimal/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: life798-mini-debug
          path: minimal/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK (unsigned fallback)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/minimal/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: life798-mini-release
          path: minimal/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      # ---------- 以下仅在推送 v* 标签时执行 ----------

      - name: Stage APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/798-mini-${GITHUB_REF_NAME}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/798-mini-${GITHUB_REF_NAME}-release.apk"
          fi
          ls -la out/

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 798 小助手 ${{ github.ref_name }}
          fail_on_unmatched_files: false
          body: |
            **798 小助手 ${{ github.ref_name }}**

            慧生活798 的极度精简客户端，只做一件事：扫码启动用水设备。

            ## 功能
            - 手机号 + 图形验证码 + 短信验证码登录
            - 扫描设备二维码，自动提取设备编号
            - 一键启动设备
            - 启动后在设备本体上结算（服务端限制，App 无法停止）

            ## 不提供
            钱包、积分、多任务签到、多账户、小部件、快捷磁贴、消费统计、推送、广告、埋点、崩溃上报。

            ## 安装
            下载下方 APK 直接安装。需 Android 8.0 及以上，首次使用需登录。

            两个包功能相同，任选其一：
            - `798-mini-<版本>.apk`：debug 构建，体积较大，兼容性最稳
            - `798-mini-<版本>-release.apk`：R8 优化，体积约为前者六分之一

            ## 说明
            - 非官方项目，与服务提供方无关
            - 请仅使用你本人有权访问的账户和设备
          files: |
            minimal/out/*.apk
          draft: false
          prerelease: false
