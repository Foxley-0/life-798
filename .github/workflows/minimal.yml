name: Build Minimal APK

on:
  push:
    branches: [ dev, main ]
    paths:
      - 'minimal/**'
      - '.github/workflows/minimal.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'minimal/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minimal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 缓存 ~/.gradle 与 wrapper 分发包。
      # 没有这步时，每次 run 都要重新下载 140MB 的 gradle-9.5.0-bin.zip
      # 和全部 Maven 依赖，日志停在 "Downloading https://services.gradle.org/..."
      # 很久，看起来像卡住，其实是纯下载。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: minimal
          cache-read-only: false

      - name: Prepare Android SDK
        run: |
          # GitHub 的 ubuntu runner 自带 Android SDK，直接用 ANDROID_HOME，
          # 不再依赖 setup-android action（该 action 在部分环境会失败）。
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK 目录: $SDK"
          ls "$SDK" || true

          SM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          echo "sdkmanager: ${SM:-未找到}"

          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platforms;android-37" "build-tools;35.0.0" 2>&1 | tail -5 || true
          fi
          echo "已安装 platforms:"
          ls "$SDK/platforms" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate secrets.properties
        env:
          API_GATEWAY: ${{ secrets.API_GATEWAY }}
          APP_SIGN_SALT: ${{ secrets.APP_SIGN_SALT }}
        run: |
          if [ -z "$API_GATEWAY" ]; then
            echo "::warning::未配置 Secret API_GATEWAY，产出的 APK 无法连接服务端，仅用于验证编译是否通过"
          fi
          if [ -z "$APP_SIGN_SALT" ]; then
            echo "::warning::未配置 Secret APP_SIGN_SALT，登录签名会失败"
          fi
          printf 'API_GATEWAY=%s\n' "$API_GATEWAY" > secrets.properties
          printf 'APP_SIGN_SALT=%s\n' "$APP_SIGN_SALT" >> secrets.properties
          echo "secrets.properties 已生成（内容不打印）"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次使用默认 debug 签名（每次构建签名都不同，无法覆盖安装）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.keystore
          SIZE=$(stat -c%s release.keystore 2>/dev/null || echo 0)
          echo "keystore 还原: $SIZE 字节"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::keystore 只有 $SIZE 字节，不是合法文件，请检查 KEYSTORE_BASE64"
            rm -f release.keystore
            exit 1
          fi

      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/minimal/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: life798-mini-debug
          path: minimal/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/minimal/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        # 之前这里是 continue-on-error: true，结果 v1.2.0 的 release 构建
        # 因为 about_avatar.png 其实是 JPEG 而失败，被静默吞掉，
        # 发布出去的只有 debug 包。改成失败即中断，问题立刻可见。
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: life798-mini-release
          path: minimal/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ---------- 以下仅在推送 v* 标签时执行 ----------

      - name: Stage APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/798-mini-${GITHUB_REF_NAME}.apk"
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::release APK 没生成，检查上一步 assembleRelease 的日志"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "out/798-mini-${GITHUB_REF_NAME}-release.apk"
          ls -la out/

      # 发布正文来自仓库根的 RELEASE_NOTES.md —— 每次发版前改它，
      # 写的是「这一版改了什么」，而不是「这个 App 是什么」。
      # App 的更新弹窗直接解析这份正文，所以格式要守住：
      # 条目一律以 "- " 开头，一条一行；不要写段落。
      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: |
          NOTES="$GITHUB_WORKSPACE/RELEASE_NOTES.md"
          if [ -s "$NOTES" ]; then
            echo "使用 RELEASE_NOTES.md（$(wc -l < "$NOTES") 行）"
            exit 0
          fi
          echo "::warning::RELEASE_NOTES.md 缺失或为空，使用最小正文"
          printf '%s\n' "**798 小助手 ${GITHUB_REF_NAME}**" "" "详见仓库提交记录。" > "$NOTES"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 798 小助手 ${{ github.ref_name }}
          fail_on_unmatched_files: false
          body_path: RELEASE_NOTES.md
          files: |
            minimal/out/*.apk
          draft: false
          prerelease: false
